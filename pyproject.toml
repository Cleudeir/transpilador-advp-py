[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyadvpl"
version = "0.2.1"
description = "Um framework para escrever código Python e transpilar para ADVPL no Protheus"
authors = [
    { name = "Cleudeir", email = "dev@example.com" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "pytest",
    "httpx"
]
requires-python = ">=3.8"

[project.scripts]
pyadvpl = "pyadvpl.engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyadvpl*"]
